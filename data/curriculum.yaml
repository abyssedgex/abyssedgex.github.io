hero:
  kicker: "❯ cat curriculum.md"
  title: "FDE 工业智能课程体系"
  subtitle: "以知识架构为内核，培养能把 AI 落到工业现场的人"
  description: "工具会变，模型会变，框架会变；但定义问题、理解系统、建模领域、交付价值的能力不会。课程围绕「认知—建模—工程—应用—交付」展开，用两条专精路径承载同一套知识内核。"
  stats:
    - value: "2"
      label: "专精路径"
      anchor: "tracks"
    - value: "4"
      label: "成长阶段"
      anchor: "levels"
    - value: "6"
      label: "知识支柱"
      anchor: "knowledge"
    - value: "8"
      label: "工业场景"
      anchor: "domains"

principles:
  - title: "认知先于工具"
    desc: "先建立不变的知识结构，再学习会过期的工具。课程不追新框架，只追可迁移的判断力。"
  - title: "问题先于方案"
    desc: "从现场问题、约束与价值定义出发，而不是从模型、提示词或框架出发。"
  - title: "双轨同源"
    desc: "工程底座与场景应用共用一套 Know-how，不培养「只会调参」或「只会讲方案」的人。"
  - title: "现场先于演示"
    desc: "以真实工业场景的数据、节拍、安全与 ROI 作为验收标准，而不是以 Demo 好看为标准。"
  - title: "证据先于证书"
    desc: "用可运行的产物、评估报告、上线结果与用户反馈证明能力，证书只是副产品。"
  - title: "沉淀先于扩张"
    desc: "每个项目都要沉淀为可复用的知识文件、方法与案例，让下一次交付更快。"

knowledge:
  title: "知识架构 · Know-how"
  lead: "课程的重心不是「教会多少个工具」，而是建立一套可以迁移到任何工具上的知识结构。六根支柱贯穿四个阶段，反复加深。"
  pillars:
    - id: "KA-01"
      name: "第一性原理"
      en: "First Principles"
      question: "这个系统里，哪些是物理规律、约束与守恒，哪些只是当前工具的限制？"
      desc: "把问题拆到不可再分的变量、约束与因果关系；区分事实、假设与叙事，避免从「别人都这么做」出发。"
      practices:
        - "约束清单"
        - "因果链拆解"
        - "反事实检验"
    - id: "KA-02"
      name: "系统思维"
      en: "Systems Thinking"
      question: "改变一个变量，系统会在哪里产生反噬、延迟或涌现？"
      desc: "用存量、流量、反馈回路、延迟与瓶颈理解工业系统；关注局部最优如何损害全局最优。"
      practices:
        - "系统回路图"
        - "瓶颈分析"
        - "二阶效应"
    - id: "KA-03"
      name: "领域建模"
      en: "Domain Modeling"
      question: "这个行业里，哪些概念是稳定的？它们之间如何连接、如何行动？"
      desc: "把设备、工艺、订单、人员、异常等现实对象，抽象为实体—关系—动作—事件；这是 AI 进入生产系统的语义接口。"
      practices:
        - "本体草图"
        - "事件风暴"
        - "领域词典"
    - id: "KA-04"
      name: "数据与不确定性"
      en: "Data & Uncertainty"
      question: "这个结论依赖哪些数据生成机制？在什么条件下会失效？"
      desc: "理解数据的产生过程、偏差、噪声与缺失；区分相关与因果，用概率而非确定论做判断。"
      practices:
        - "数据血缘"
        - "偏差审计"
        - "置信区间"
    - id: "KA-05"
      name: "知识工程"
      en: "Knowledge Engineering"
      question: "知识在谁脑子里？如何让它不随人流失，并能被检索、复用、验证？"
      desc: "把 SOP、规则、案例与专家经验转化为结构化知识；建立捕获、表示、检索、更新的闭环。"
      practices:
        - "知识地图"
        - "案例库"
        - "可追溯引用"
    - id: "KA-06"
      name: "价值与决策"
      en: "Value & Decision"
      question: "这件事值得做吗？做完如何证明它真的产生了价值？"
      desc: "用结果、置信度、时间与成本衡量方案；理解 ROI、风险、可逆性与组织采纳。"
      practices:
        - "价值假设"
        - "基线测量"
        - "复盘账本"
  note: "六根支柱不是六门课，而是六条贯穿所有课程的主线。每门课都要标注：它依赖哪根支柱，又强化哪根支柱。"

capabilities:
  title: "五维能力 · π 型结构"
  lead: "π 的一横是五维通识，两竖是工程底座与场景应用的专精深度。先有横向判断力，再选一条纵向路径扎下去。"
  items:
    - name: "认知力"
      en: "Cognition"
      desc: "把问题拆到第一性原理，看见系统结构与不确定性。"
    - name: "建模力"
      en: "Modeling"
      desc: "把领域知识抽象为实体、关系、动作与可计算的结构。"
    - name: "工程力"
      en: "Engineering"
      desc: "让数据、模型、工具与平台在云、边、端稳定运行。"
    - name: "应用力"
      en: "Application"
      desc: "定义价值、设计工作流、组织评估，让 AI 真正解决问题。"
    - name: "交付力"
      en: "Delivery"
      desc: "推动组织采纳，衡量结果，把一次成功变成可复制的方法。"

shared_core:
  title: "共同底座"
  lead: "两条路径共享同一套底座。先学共同的，再选一条专精。"
  items:
    - id: "K0"
      name: "认知底座"
      desc: "KA-01 ~ KA-06 六根知识支柱"
    - id: "K1"
      name: "AI / LLM 基础"
      desc: "Token、Embedding、Context、推理与评估"
    - id: "K2"
      name: "工业现场基础"
      desc: "OT / IT、PLC / SCADA、协议、节拍与安全"
    - id: "K3"
      name: "软件与数据基础"
      desc: "Python / SQL / Git / API / 测试"
    - id: "K4"
      name: "安全、伦理与合规"
      desc: "隐私、权限、护栏、审计与责任边界"
    - id: "K5"
      name: "项目与沟通"
      desc: "发现、干系人、变更管理与价值汇报"

tracks_intro:
  title: "两条专精路径"
  lead: "我认可「工程 / 应用」这个二分，但它不是两个职业，而是同一能力栈上的两条专精路径：共同底座相同，出口不同，最终在综合实战中汇合。"
  note: "一个人不必同时精通两条，但任何一条都不能绕过知识架构。做工程底座的人要能判断价值与采纳；做场景应用的人要能判断可行性与运行代价。"

tracks:
  - id: "engineering"
    name: "FDE 工程底座"
    en: "BUILD & RUN"
    tagline: "让模型、数据、工具与平台，在云、边、端稳定运行。"
    audience: "研发工程师、平台 / 运维工程师、架构师"
    goal: "能把一个工业 AI 方案从代码跑到生产，并守住可靠性、安全与成本。"
    outcome: "独立完成部署、监控、降级、扩容与成本优化。"
    modules:
      - id: "E1"
        name: "工程基础与代码素养"
        level: "L2"
        ka: "KA-01 · KA-02"
        desc: "Python / TypeScript、Git、测试、API 设计；建立可维护、可协作的服务骨架。"
        artifact: "可维护的服务骨架"
      - id: "E2"
        name: "工业数据工程"
        level: "L2"
        ka: "KA-03 · KA-04"
        desc: "SQL、时序数据、OPC UA / MQTT、数据质量与血缘；把现场数据变成可用资产。"
        artifact: "可追溯的数据管道"
      - id: "E3"
        name: "模型与推理工程"
        level: "L3"
        ka: "KA-01 · KA-04"
        desc: "LLM 基础、推理引擎、量化、vLLM / SGLang、边缘推理与资源规划。"
        artifact: "可复现的推理服务"
      - id: "E4"
        name: "部署与运行"
        level: "L3"
        ka: "KA-02 · KA-06"
        desc: "Docker / K8s、CI/CD、可观测性、灰度与降级、成本与容量。"
        artifact: "上线与运行手册"
      - id: "E5"
        name: "平台与系统集成"
        level: "L3-L4"
        ka: "KA-03 · KA-05"
        desc: "MES / ERP / SCADA、Ontology、MCP、API 集成；让 AI 进入真实业务流。"
        artifact: "跨系统集成方案"
      - id: "E6"
        name: "安全与治理"
        level: "L4"
        ka: "KA-02 · KA-06"
        desc: "Guardrails、RBAC、审计、隐私与事件响应；建立可追责的运行边界。"
        artifact: "安全评估与治理清单"
  - id: "application"
    name: "FDE 场景应用"
    en: "DISCOVER & DELIVER"
    tagline: "把模糊的现场问题，翻译成可交付、可验证的 AI 方案。"
    audience: "产品经理、售前 / 解决方案顾问、交付顾问、业务分析、技术管理者"
    goal: "能定义问题、设计工作流、组织评估，并推动方案被现场真正采纳。"
    outcome: "独立完成发现、方案、PoC、评估与推广。"
    modules:
      - id: "A1"
        name: "问题发现与价值定义"
        level: "L2"
        ka: "KA-01 · KA-06"
        desc: "访谈、流程映射、基线、ROI 与优先级；把「痛点」变成可验证的问题陈述。"
        artifact: "问题陈述与价值假设"
      - id: "A2"
        name: "上下文与提示工程"
        level: "L2"
        ka: "KA-03 · KA-05"
        desc: "Context Engineering、结构化输出、提示评估；让模型在约束内稳定工作。"
        artifact: "可复用的上下文包"
      - id: "A3"
        name: "RAG 与知识助手"
        level: "L3"
        ka: "KA-03 · KA-05"
        desc: "分块、混合检索、重排、引用与评估；让答案可追溯、可维护。"
        artifact: "可追溯的知识助手"
      - id: "A4"
        name: "Agentic 工作流"
        level: "L3"
        ka: "KA-02 · KA-03"
        desc: "Harness、工具设计、MCP、多智能体与 HITL；把能力组织成可审计的流程。"
        artifact: "可审计的 Agent 工作流"
      - id: "A5"
        name: "评估与可观测性"
        level: "L3-L4"
        ka: "KA-04 · KA-06"
        desc: "离线 / 在线评估、Tracing、A/B 与成本追踪；用数据判断「能不能上线」。"
        artifact: "评估报告与监控面板"
      - id: "A6"
        name: "交付与变更管理"
        level: "L4"
        ka: "KA-05 · KA-06"
        desc: "试点、培训、推广、治理与复盘；让系统被使用，而不是被验收后闲置。"
        artifact: "交付计划与采纳报告"

domains:
  title: "工业场景纵深"
  lead: "每个场景都同时训练两条路径：一条负责「跑起来」，一条负责「用起来」。"
  items:
    - name: "设备预测性维护"
      data: "振动、温度、电流、工单"
      method: "异常检测、剩余寿命、诊断 Agent"
      difficulty: "数据质量与误报成本"
    - name: "机器视觉质检"
      data: "图像、缺陷标注、工艺参数"
      method: "检测 / 分割、边缘推理、人机复核"
      difficulty: "小样本与产线节拍"
    - name: "工艺参数优化"
      data: "工艺参数、质量结果、实验记录"
      method: "贝叶斯优化、因果分析、数字孪生"
      difficulty: "试错成本与安全边界"
    - name: "生产排程与调度"
      data: "订单、产能、物料、交期"
      method: "约束优化、仿真、调度 Agent"
      difficulty: "多目标冲突与实时性"
    - name: "能耗与碳管理"
      data: "电、气、水、产量"
      method: "时序预测、归因分析、优化"
      difficulty: "计量粒度与基线口径"
    - name: "工业知识助手"
      data: "SOP、手册、工单、专家访谈"
      method: "RAG、知识图谱、引用溯源"
      difficulty: "隐性知识与权限边界"
    - name: "安环与风险预警"
      data: "传感器、视频、巡检、事故记录"
      method: "多模态、规则 + 模型、告警分级"
      difficulty: "漏报误报与合规责任"
    - name: "供应链与库存优化"
      data: "采购、库存、物流、需求"
      method: "需求预测、优化、仿真"
      difficulty: "外部不确定性与数据共享"

levels:
  title: "四阶成长路径"
  lead: "从看见问题，到做出一个，再到跑在生产，最后复制规模化。每一阶都以证据结业。"
  items:
    - id: "L1"
      name: "认知级 · 看见问题"
      duration: "2-4 周"
      audience: "管理者、业务骨干、入门者"
      focus:
        - "AI 与工业 AI 的基本认知"
        - "第一性原理与系统思维"
        - "工业现场见习与场景地图"
        - "工具上手与安全边界"
      evidence: "场景地图 + 问题陈述 + 概念测试"
    - id: "L2"
      name: "实践级 · 做出一个"
      duration: "6-8 周"
      audience: "初级工程师、业务分析、产品 / 售前"
      focus:
        - "共同底座 + 一条路径基础"
        - "单场景 PoC"
        - "评估入门与复盘"
      evidence: "可运行 PoC + 评估报告 + 复盘"
    - id: "L3"
      name: "进阶级 · 跑在生产"
      duration: "10-12 周"
      audience: "FDE、交付工程师、产品经理"
      focus:
        - "完整路径与端到端场景"
        - "可靠性、安全与成本"
        - "变更管理与用户采纳"
      evidence: "上线系统 + 运行报告 + 用户反馈"
    - id: "L4"
      name: "专家级 · 复制与规模化"
      duration: "12-16 周"
      audience: "架构师、交付负责人、技术管理者"
      focus:
        - "平台化与多场景组合"
        - "组织能力与治理标准"
        - "方法论沉淀与团队培养"
      evidence: "平台 / 多场景方案 + 组织级落地 + 方法论"

capstones:
  title: "综合实战"
  lead: "两条路径在第 3 层汇合：共同对一个真实工业结果负责。"
  items:
    - id: "C1"
      name: "设备健康助手"
      tracks: "工程 + 应用"
      desc: "接入 OT 数据，做异常检测与剩余寿命，再用 RAG + 诊断 Agent 生成可执行的维护建议。"
      evidence: "上线系统、误报率、MTTR 改善"
    - id: "C2"
      name: "质检视觉工作台"
      tracks: "工程 + 应用"
      desc: "边缘推理 + 视觉模型 + 人机复核 + 评估闭环，满足产线节拍与准确率要求。"
      evidence: "节拍、准确率、人工复核率"
    - id: "C3"
      name: "工艺知识引擎"
      tracks: "应用 + 知识工程"
      desc: "把 SOP、工单与专家经验做成可检索、可引用的知识图谱与问答系统。"
      evidence: "引用准确率、专家评审、复用次数"
    - id: "C4"
      name: "多场景 FDE 平台"
      tracks: "工程 + 应用 + L4"
      desc: "抽象共性能力，支撑多个场景复用，并建立权限、评估、成本与治理体系。"
      evidence: "场景复用数、单位成本、治理审计"

assessment:
  title: "评估与认证"
  lead: "不靠一张卷子。用四类证据判断能力是否真的形成。"
  items:
    - weight: "30%"
      name: "知识架构"
      desc: "概念图、第一性原理分析、领域本体设计"
    - weight: "30%"
      name: "工程产物"
      desc: "代码仓库、部署、运行手册与可复现性"
    - weight: "30%"
      name: "场景交付"
      desc: "PoC / 上线、评估报告、干系人评审"
    - weight: "10%"
      name: "复盘沉淀"
      desc: "知识文件、方法论、内部分享与复用"

references:
  title: "参考框架与差异"
  lead: "吸收了七类来源的长处，也刻意补上它们的缺口。不是拼盘，而是各取所需后重新长出结构。"
  items:
    - name: "CloudStudio 课程库"
      url: "https://cloudstudio.net/course-library"
      detail: "110 门课、11 个方向、L1-L4 难度、5 类角色"
      strength: "分类法清晰，角色与难度维度完整，产品工具课丰富"
      gap: "偏工具与产品，工业纵深和知识主线较弱"
      takeaway: "采用其方向 / 角色 / 难度 / 学习形式的分类维度"
    - name: "FDE Learning Center"
      url: "https://luoboask.github.io/fde-learning/agentic-ai/"
      detail: "Agentic AI 七层路线图：基础、单 Agent、多 Agent、生产、面试、平台、RAG 与协议"
      strength: "Agent 工程、生产部署、评估与实战闭环扎实"
      gap: "以工具与面试为导向，工业场景和领域建模不足"
      takeaway: "采用其 Agentic 工程深度与「基础先行、实战闭环」"
    - name: "宁波工业互联网研究院"
      url: "https://nb-iiot-institute.app.workbuddy.host/index.html"
      detail: "四层人才体系 + 五层技术平台 + 产教融合闭环"
      strength: "产业人才阶梯、平台架构与真实场景闭环"
      gap: "课程颗粒度较粗，缺少知识架构与双轨路径"
      takeaway: "采用其启蒙—入门—进阶—专家的人才阶梯与产业闭环"
    - name: "Palantir FDE / Ontology"
      url: "https://www.palantir.com/docs/foundry/ontology/overview/"
      detail: "FDE 嵌入客户，把模糊问题变成可运行系统；Ontology 连接对象、关系、动作与安全"
      strength: "场景交付、语义层与生产可靠性"
      gap: "强依赖平台生态，不适合直接照搬"
      takeaway: "采用其「一人一客户、多能力」的 FDE 视角与 Ontology 建模方法"
    - name: "AI Engineer / Agentic AI Roadmap 2026"
