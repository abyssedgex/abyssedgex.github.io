<a href=/talks/>Talks</a>
<a href=/projects/>项目</a></span></nav></header><main class=main><article class=post><h1 class=post-title>静夜思</h1><time class=post-date>2017-10-11</time><div class=post-content><p>名贱身轻，小口如锋，穿衣噆肤，娇声夜摆迷魂阵。</p><p>潜侵鸣镝，夜不能寐，惊回千里梦，已三更。</p><p>独自觅蚊影，虫廖廖，窗外雨如雷。</p><p>凭栏看落花，人悄悄，决眦入归鸟。</p><p>闲来垂钓碧溪上，又挂云帆济沧海。</p><p>欲渡黄河冰塞川，多岐路。</p><p>小憩涼窗梦惊觉，幽幽回首听叹息。</p></div></article></main><footer class=footer><p>© 2026 Lizorn</p></footer></div></body></html>
