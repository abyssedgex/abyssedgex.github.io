<a href=/talks/>Talks</a>
<a href=/projects/>项目</a></span></nav></header><main class=main><article class=post><h1 class=post-title>香港何以难平？</h1><time class=post-date>2019-08-14</time><div class=post-content><p>2008年次贷危机从金融领域扩散到实体经济领域，它所带来的矛盾和冲突还未化解。</p><p>一是经济发展“失调”：虚拟经济和实体经济失衡、债务负担加重、社会福利风险增加。
二是政治体制“失灵”：西式选举难以选贤、政党利益勾勒”民主陷阱“。
三是社会融合“失效”：社会极端思潮抬头、群体事件增多。</p><p>老人“忧于人前,乐于人后”。青年要么“996”，要么陷入到丧文化里：保温壶里泡枸杞。</p><p>社会的焦虑和忧愁不断迭代，这种忧漫无边际。</p><p>忧从何来？来自“贫穷”。</p></div></article></main><footer class=footer><p>© 2026 Lizorn</p></footer></div></body></html>
