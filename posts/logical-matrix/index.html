<a href=/projects/>项目</a></span></nav></header><main class=main><article class=post><h1 class=post-title>逻辑矩阵</h1><time class=post-date>2019-01-27</time><div class=post-content><h2 id=直言命题六角矩阵>直言命题六角矩阵</h2><p><img src=/res/img/logic/AEaeIO.png alt></p><h3 id=元素>元素</h3><ul><li>A，全称肯定命题</li><li>E，全程否定命题</li><li>I，特称肯定命题</li><li>O，特称否定命题</li><li>a，单称肯定命题</li><li>e:，单称否定命题</li></ul><h3 id=关系关系>关系关系</h3><ul><li>A，差等关系。
从上位的真可确定地得出下位的真，由下位的假可确定地得出上位的假。</li><li>E，反对关系。
从其一者真可确定地推出其余者假。</li><li>I，下等关系。
从其一者假可确定地推出其余者真。</li><li>O，矛盾关系。
两者之间，由一真可知余假，由一假可知余真。</li></ul></div></article></main><footer class=footer><p>© 2026 Lizorn</p></footer></div></body></html>
