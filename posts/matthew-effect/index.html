<a href=/projects/>项目</a></span></nav></header><main class=main><article class=post><h1 class=post-title>马太效应基模</h1><time class=post-date>2019-01-15</time><div class=post-content><blockquote><p>凡有的，还要加倍给他叫他多余；没有的，连他所有的也要夺过来。资源总是流向原本基础好的地方，形成聚集效应。</p></blockquote><h1 id=因果回路图>因果回路图</h1><p><img src=/res/img/Matthew-Effect/Matthew-Effect.jpg alt></p><h1 id=结构特征>结构特征</h1><p><code>马太效应</code>基于两个前提：</p><ol><li>资源是有限的</li><li>怎么分配有限的资源是根据行为者过去的表现来分配的</li></ol><h1 id=如何打破马太效应>如何打破马太效应？</h1><ol><li>设法去寻找能够平衡双方绩效表现的上层目标</li><li>改变双方的成功评价标准，引导双方朝不同的方向发展</li></ol></div></article></main><footer class=footer><p>© 2026 Lizorn</p></footer></div></body></html>
