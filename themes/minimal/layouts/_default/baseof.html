<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if or .Params.pagefindIgnore (eq .Kind "404") }} data-pagefind-ignore{{ end }}>
  <div class="container">
    <header class="header">
      <nav class="nav">
        <a class="brand" href="{{ "/" | relURL }}">
          <img class="logo" src="/logo.svg" alt="" width="24" height="24">
          <span class="brand-name">{{ .Site.Title }}</span>
        </a>
        <span class="nav-links">
          {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
          {{ end }}
        </span>
      </nav>
    </header>
    <main class="main"{{ if and .IsPage (not .Params.pagefindIgnore) }} data-pagefind-body{{ end }}>
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="footer">
      <p>© {{ now.Format "2006" }} {{ .Site.Params.author }}{{ with .Site.Params.motto }} · {{ . }}{{ end }}</p>
    </footer>
  </div>
</body>
</html>
