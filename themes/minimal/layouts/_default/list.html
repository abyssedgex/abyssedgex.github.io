{{ define "main" }}
<section class="list">
  <h1 class="list-title">{{ .Title }}</h1>
  <div class="list-items">
    {{ range .Pages.ByDate.Reverse }}
      <article class="list-item">
        <time class="list-item-date">{{ .Date.Format "2006-01-02" }}</time>
        <a class="list-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
